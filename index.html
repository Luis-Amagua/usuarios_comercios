function sres(ok,t,h){$('#sr').innerHTML=`<div class="res ${ok?'ok':'no'}"><b>${ok?'✓':'✕'} ${t}</b><p style="margin-top:4px">${h}</p></div>`}
async function logEv(token,result,detail,c){const e={id:uid(),token,merchant_id:me.merchantId,merchant:me.name,actor:me.user||'comercio',result,detail,coupon_id:c?.id||null,at:new Date().toISOString()};if(sb){try{await sb.from('events').insert([e])}catch(x){}}ev.unshift(e)}
async function validate(v){
 const en=(v||'').trim().toUpperCase();if(!en)return toast('Introduce o escanea un código');
 let c=null;
 if(sb){try{const{data}=await sb.from('coupons').select('*').or(`short_code.eq.${en},token.eq.${en}`).limit(1);if(data&&data.length)c=data[0]}catch(e){}}
 if(!c)c=coupons.find(x=>x.short_code===en||x.token===en);
 const code=c?.short_code||en;let r;
 if(!c)r=['NOT_FOUND','Código no reconocido','No encontramos un cupón con ese código.'];
 else if(c.merchant_id!==me.merchantId)r=['WRONG_MERCHANT','Cupón de otro comercio','Pertenece a '+esc(c.merchant)+'.'];
 else if(c.status==='REDEEMED')r=['ALREADY_REDEEMED','Cupón ya utilizado','Este cupón ya fue canjeado.'];
 else if(c.status!=='ACTIVE')r=['INACTIVE','Cupón no disponible','Estado actual: '+esc(c.status)+'.'];
 else if(c.expires_at&&Date.now()>new Date(c.expires_at).getTime())r=['EXPIRED','Cupón vencido','La vigencia de este cupón terminó.'];
 if(r){await logEv(code,r[0],r[1],c);sres(false,r[1],r[2]);loadMerchant();return}
 let nm='Cliente';if(sb){try{const{data}=await sb.from('users').select('first,last').eq('email',String(c.client||'').toLowerCase()).limit(1);if(data&&data.length)nm=((data[0].first||'')+' '+(data[0].last||'')).trim()||nm}catch(e){}}
 await logEv(code,'READ_VALID','Lectura válida; pendiente de confirmación',c);
 sres(true,'Cupón válido',`<b>${esc(c.offer)}</b><br>Cliente: ${esc(nm)}<br>Código: <b>${esc(c.short_code)}</b><br><button class="btn gr" style="margin-top:10px" onclick="redeem('${c.id}')">Confirmar canje</button><button class="btn sec sm" style="margin-top:8px" onclick="$('#sr').innerHTML=''">Cancelar</button>`);loadMerchant()}
async function redeem(id){
 let c=mine.find(x=>x.id===id)||coupons.find(x=>x.id===id);
 if(sb){try{const{data}=await sb.from('coupons').select('*').eq('id',id).limit(1);if(data&&data.length)c=data[0]}catch(e){}}
 if(!c||c.status!=='ACTIVE'){toast('El cupón ya no está disponible');$('#sr').innerHTML='';return}
 if(c.merchant_id!==me.merchantId)return toast('Comercio no autorizado');
 const at=new Date().toISOString();c.status='REDEEMED';c.redeemed_at=at;
 if(sb){try{await sb.from('coupons').update({status:'REDEEMED',redeemed_at:at,redeemed_by:me.user||'empleado'}).eq('id',id)}catch(e){}}
 await logEv(c.short_code||c.token,'REDEEMED','Canje confirmado',c);sres(true,'Canje confirmado','El cupón quedó inhabilitado.');toast('Canje registrado');loadMerchant()}
async function startScan(){
 if(!window.Html5Qrcode)return toast('No se pudo cargar el lector QR.');
 try{if(!qr)qr=new Html5Qrcode('reader');
  await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:200,height:200}},d=>{stopScan();validate(d.includes('|')?d.split('|').pop():d)},()=>{});toast('Cámara activada')}
 catch(e){toast('No se pudo activar la cámara.')}}
async function stopScan(){if(qr){try{if(qr.isScanning)await qr.stop()}catch(e){}qr=null}}
function execBody(){
 const red=mine.filter(c=>c.status==='REDEEMED'),camps=myOffers(),act=mine.filter(c=>eff(c)==='ACTIVE').length;
 const rows=camps.map(o=>({n:o.offer,v:red.filter(c=>c.promotion_id===o.id||c.offer===o.offer).length})),mx=Math.max(1,...rows.map(r=>r.v));
 return`<div class="metrics"><div><span>Canjeados</span><b>${red.length}</b></div><div><span>Campañas activas</span><b>${camps.filter(isActive).length}</b></div><div><span>Cupones activos</span><b>${act}</b></div><div><span>Lecturas</span><b>${ev.length}</b></div></div>
 <div class="card"><h3 style="margin-bottom:10px">Canjes por campaña</h3>${rows.length?rows.map(r=>`<div class="row"><small>${esc(r.n)}</small><b>${r.v}</b></div><div class="bar"><i style="width:${r.v/mx*100}%"></i></div>`).join(''):'<p class="sub">Aún no hay campañas.</p>'}</div>${dayH(red)}`}
const rdt=c=>c.redeemed_at||(ev.find(x=>x.result==='REDEEMED'&&x.coupon_id===c.id)||{}).at||c.created_at;
const COLORS=['#f47721','#2868a8','#198754','#8e44ad','#e64a38','#d4a017','#17a2b8','#6c757d'];
function dayH(red){
 const lab=c=>(offers.find(o=>o.id===c.promotion_id)||{}).offer||c.offer||'Campaña';
 const names=[];myOffers().forEach(o=>{if(!names.includes(o.offer))names.push(o.offer)});red.forEach(c=>{const l=lab(c);if(!names.includes(l))names.push(l)});
 const key=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:'America/Guayaquil'});
 const first=red.length?red.map(c=>key(rdt(c))).sort()[0]:key(Date.now()),today=key(Date.now()),days=[];
 for(let t=new Date(first+'T12:00:00Z'),n=0;n<3650;t=new Date(t.getTime()+864e5),n++){const k=t.toISOString().slice(0,10);if(k>today)break;days.push(k)}
 const data=Object.fromEntries(days.map(d=>[d,{}]));
 red.forEach(c=>{const d=key(rdt(c));if(data[d]){const l=lab(c);data[d][l]=(data[d][l]||0)+1}});
 const tot=d=>Object.values(data[d]).reduce((a,b)=>a+b,0),mx=Math.max(1,...days.map(tot));
 const head='<h3>Canjes por día</h3><p class="sub" style="margin-bottom:10px">Historial completo, desde el primer canje hasta hoy. Cada color es una campaña.</p>';
 if(!days.some(d=>tot(d)>0))return`<div class="card">${head}<p class="sub">Aún no hay canjes confirmados.</p></div>`;
 const legend=names.map((n,i)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin:0 12px 6px 0;font-size:10.8px"><i style="width:10px;height:10px;border-radius:3px;background:${COLORS[i%8]}"></i>${esc(n)}</span>`).join('');
 const cols=days.map(d=>{const t=tot(d),segs=names.map((n,i)=>{const v=data[d][n]||0;return v?`<div title="${esc(n)}: ${v}" style="height:${v/mx*100}%;background:${COLORS[i%8]}"></div>`:''}).join('');
  const mo=(d.slice(8)==='01'||d===days[0])?new Date(d+'T12:00:00').toLocaleDateString('es-EC',{month:'short',year:(d.slice(5,7)==='01'||d===days[0])?'2-digit':undefined}):'';
  return`<div style="flex:0 0 24px;display:flex;flex-direction:column;align-items:center"><small style="font-size:10px;font-weight:800;height:14px">${t||''}</small><div style="height:130px;width:100%;display:flex;flex-direction:column-reverse;gap:1px;border-bottom:1px solid var(--ln)">${segs}</div><small style="font-size:10px;color:var(--mu);margin-top:3px">${d.slice(8)}</small><small style="font-size:10px;color:var(--o);font-weight:800;height:12px">${mo}</small></div>`}).join('');
 return`<div class="card">${head}<div>${legend}</div><div style="display:flex"><div style="display:flex;flex-direction:column;justify-content:space-between;height:130px;margin-top:14px;padding-right:6px;font-size:10px;color:var(--mu);text-align:right"><span>${mx}</span><span>0</span></div><div id="dsc" style="overflow-x:auto;flex:1"><div style="display:flex;gap:3px;min-width:max-content">${cols}</div></div></div></div>`}
function execH(){return`<div id="ex">${execBody()}</div>`}
function promosH(){const l=myOffers();if(!l.length)return'<div class="empty">No tienes campañas creadas en este momento.</div>';
 return l.map(o=>{const a=isActive(o);return`<article class="card offer"><div class="vis"><span class="badge">${esc(o.discount)}</span><img loading="lazy" src="${esc(o.image)}" alt=""></div><div class="ob"><h3>${esc(o.shop)}</h3><p class="sub">${esc(o.offer)}</p><p class="sub">📍 ${esc(o.branch)}, Quito</p>${termsH(o.terms.length?o.terms:TERMS,o.validAt||('Sucursal '+o.branch))}<div class="row"><small class="sub">Hasta ${esc(o.expires)}</small><span class="pill ${a?'p-ok':'p-exp'}">${a?'ACTIVA':'INACTIVA'}</span></div></div></article>`}).join('')}

addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;if(me&&view==='profile')render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();loadOffers();if(me?.role==='client')loadCoupons();
