<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f47721"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuponeraff"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cuponeraff | descubre · ahorra · disfruta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--o:#f47721;--od:#df5e0c;--cr:#fff7ef;--ink:#252525;--mu:#777;--ln:#f0e5dc;--gr:#198754;--rd:#e64a38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--cr);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input{font:inherit}button{cursor:pointer;border:0}h1,h2,h3,p{margin:0}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--ln);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--o)}
.wrap{padding:16px;max-width:620px;margin:auto}.hide{display:none!important}
.card{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #f4772110}
.btn{background:var(--o);color:#fff;border-radius:14px;padding:13px 18px;font-weight:800;width:100%}.btn:active{background:var(--od)}
.btn.sec{background:#fff;color:var(--o);border:2px solid var(--o)}.btn.red{background:#fff;color:var(--rd);border:2px solid var(--rd)}.btn.gr{background:var(--gr)}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.field{width:100%;padding:13px 14px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;outline:0}.field:focus{border-color:var(--o)}
label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}.sub{color:var(--mu);font-size:13px}
.err{color:var(--rd);font-size:13px;font-weight:700;margin-top:8px;display:none}
.link{background:none;color:var(--o);font-weight:800;padding:0}
.hero{text-align:center;padding:26px 0 14px}.hero h1{font-size:30px;line-height:1.1;margin:8px 0}.hero em{color:var(--o);font-style:normal}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin:20px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--ln)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.chip{background:#fff;border:1.5px solid var(--ln);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink)}.chip.on{background:var(--o);border-color:var(--o);color:#fff}
.offer{padding:0;overflow:hidden}.offer img{width:100%;height:150px;object-fit:cover;display:block;background:#ffe9d6}.vis{position:relative}
.badge{position:absolute;top:12px;left:12px;background:var(--o);color:#fff;font-weight:900;padding:6px 12px;border-radius:99px;font-size:14px}
.ob{padding:14px}.ob h3{font-size:17px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.terms{background:var(--cr);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:12px;color:#555}.terms ul{margin:4px 0 0;padding-left:16px}
.pill{font-size:11px;font-weight:900;padding:4px 10px;border-radius:99px}.p-ok{background:#e3f6ec;color:var(--gr)}.p-used{background:#eee;color:#666}.p-exp{background:#fde7e4;color:var(--rd)}
.seg{display:flex;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:4px;margin-bottom:14px}.seg button{flex:1;background:none;padding:10px;border-radius:11px;font-weight:800;color:var(--mu)}.seg .on{background:var(--o);color:#fff}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mu);padding:6px 0}#tabs span{font-size:22px;filter:grayscale(1);opacity:.6}
#tabs .on{color:var(--o)}#tabs .on span{filter:none;opacity:1}
#map{height:calc(100vh - 190px);min-height:340px;border-radius:20px;border:1px solid var(--ln)}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--o);color:#fff;font-size:32px;font-weight:900;display:grid;place-items:center;margin:8px auto 10px}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln);gap:12px}.kv:last-child{border:0}.kv span{color:var(--mu)}.kv b{text-align:right;word-break:break-all}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.metrics div{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px}.metrics span{font-size:12px;color:var(--mu);display:block}.metrics b{font-size:26px;color:var(--o)}
.bar{height:9px;background:var(--ln);border-radius:9px;margin:5px 0 12px}.bar i{display:block;height:100%;background:var(--o);border-radius:9px}
.res{border-radius:14px;padding:12px;margin-top:12px;font-size:14px}.res.ok{background:#e3f6ec}.res.no{background:#fde7e4}
.log{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:13px}
#sheet{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end;justify-content:center}#sheet.show{display:flex}
.sh{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));position:relative}
.x{position:absolute;right:14px;top:12px;background:var(--cr);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.plans{display:grid;gap:8px;margin:12px 0}
.plan{border:2px solid var(--ln);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.plan.on{border-color:var(--o);background:var(--cr)}.plan b{font-size:18px;color:var(--o)}
.qr{display:grid;place-items:center;margin:14px 0}.code{font-size:30px;font-weight:900;letter-spacing:5px;text-align:center;color:var(--o)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#24211f;color:#fff;padding:11px 16px;border-radius:12px;z-index:50;font-size:13px;display:none;max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
</style></head>
<body>
<div id="app"></div><nav id="tabs"></nav><div id="sheet" onclick="if(event.target===this)closeSheet()"></div><div id="toast"></div>
<script>
// ====== CONFIGURACIÓN: pega aquí tus datos reales de Supabase ======
const SB_URL='https://xx.supabase.co', SB_KEY='sb_publishable_';
const sb=window.supabase?supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true}}):null;
const DEMO={client:{user:'cliente@cuponeraff.com',pass:'cliente'},merchant:{user:'comercio',pass:'comercio',id:'m1',name:'Burger House'}};
const TERMS=['Válido únicamente con consumo en el restaurante.','No aplica para pedidos a domicilio ni para llevar.','No aplica promoción sobre promoción ni es acumulable con otras ofertas.'];
let me=null,view='auth',offers=[],loaded=false,coupons=[],cat='all',q='',cseg='act',map=null,qr=null,pend=null,plan='free',pu=null,ip=null;
try{me=JSON.parse(localStorage.getItem('cf_me')||'null')}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'CO-'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()).replaceAll('-','').slice(0,20).toUpperCase();
function shortCode(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';return L[Math.floor(Math.random()*L.length)]+String(Math.floor(Math.random()*10000)).padStart(4,'0')}
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',3500)}
const fdate=d=>d?new Date(d).toLocaleString('es-EC',{timeZone:'America/Guayaquil',dateStyle:'medium',timeStyle:'short'}):'';
const fday=d=>d?new Date(d).toLocaleDateString('es-EC'):'';
const okMail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const PLAN={free:'Plan Free · 10 cupones',monthly:'Plan Mensual · $2.99',annual:'Plan Anual · $19.99'};
const RES={READ_VALID:'Lectura válida',REDEEMED:'Canje confirmado',NOT_FOUND:'No reconocido',WRONG_MERCHANT:'Otro comercio',ALREADY_REDEEMED:'Ya utilizado',EXPIRED:'Vencido',INACTIVE:'Inactivo'};

// ====== Datos ======
function norm(r){let t=r.terms??[];if(typeof t==='string'){try{t=JSON.parse(t)}catch(_){t=t?[t]:[]}}if(!Array.isArray(t))t=[];
 return{id:r.id,merchantId:r.merchant_id,shop:r.shop||'',branch:r.branch||'',category:r.category||'',discount:r.discount||'',offer:r.offer||'',image:r.image||'',rating:r.rating??'',expires:r.expires||'',description:r.description||'',expiresISO:r.expires_iso||'',active:r.active===true,validAt:r.valid_at||'',terms:t}}
async function loadOffers(){
 if(!sb){toast('Sin conexión con la base de datos.');return}
 try{const{data,error}=await sb.from('promotions').select('id,merchant_id,shop,branch,category,discount,offer,image,rating,expires,description,expires_iso,active,valid_at,terms').order('created_at',{ascending:false});
  if(error)throw error;offers=(data||[]).map(norm);loaded=true;if(['home','promos','exec'].includes(view))render()}
 catch(e){console.error(e);toast('No se pudieron cargar las promociones.')}}
function isActive(o){if(!o||o.active!==true)return false;if(o.expiresISO){const t=new Date(o.expiresISO+'T23:59:59-05:00').getTime();if(!isNaN(t)&&Date.now()>t)return false}return true}
function eff(c){const e=c.expires_at;return c.status==='ACTIVE'&&e&&Date.now()>new Date(e).getTime()?'EXPIRED':c.status}
function termsOf(c){const o=offers.find(x=>x.id===c.promotion_id);return{t:o&&o.terms.length?o.terms:TERMS,v:(o&&o.validAt)||('Sucursal '+(c.branch||''))}}
const termsH=(t,v)=>`<div class="terms"><b>Términos y condiciones</b><ul>${t.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><div style="margin-top:6px"><b>Válido en:</b> ${esc(v)}</div></div>`;
async function loadCoupons(){
 if(sb&&me?.user){try{const{data}=await sb.from('coupons').select('*').eq('client',me.user);if(data)coupons=data}catch(e){}}
 return coupons}

// ====== Navegación ======
function go(v){stopScan();view=v;render();scrollTo(0,0)}
function render(){
 const a=$('#app'),t=$('#tabs');
 if(!me){t.style.display='none';a.innerHTML=view==='mlogin'?mloginH():authH();return}
 const cl=me.role==='client';
 const items=cl?[['home','🏠','Inicio'],['map','🗺️','Mapa'],['coupons','🎟️','Mis cupones'],['profile','👤','Perfil']]:[['validate','▦','Validar'],['exec','📊','Resumen'],['promos','🏷️','Campañas'],['profile','👤','Perfil']];
 if(!items.some(i=>i[0]===view))view=items[0][0];
 t.style.display='flex';
 t.innerHTML=items.map(i=>`<button class="${view===i[0]?'on':''}" onclick="go('${i[0]}')"><span>${i[1]}</span>${i[2]}</button>`).join('');
 const V={home:homeH,map:mapH,coupons:couponsH,profile:profileH,validate:validateH,exec:execH,promos:promosH}[view];
 a.innerHTML=`<div class="top"><div class="logo">Cuponera<b>ff.</b></div><span class="sub">${cl?'Hola, '+esc(me.name.split(' ')[0]):'🏪 '+esc(me.name)}</span></div><div class="wrap">${V()}</div>`;
 if(view==='map')initMap();if(view==='coupons')loadCoupons().then(()=>{if(view==='coupons')$('#cl').innerHTML=couponListH()});
 if(view==='validate'||view==='exec')loadMerchant();
}
function setMe(u){me=u;localStorage.setItem('cf_me',JSON.stringify(u));view=u.role==='client'?'home':'validate';render()}
function logout(){stopScan();me=null;coupons=[];localStorage.removeItem('cf_me');view='auth';render();toast('Sesión cerrada')}

// ====== Acceso ======
function authH(){return`<div class="wrap"><div class="hero"><div class="logo" style="font-size:34px">Cuponera<b>ff.</b></div><h1>Descubre.<br><em>Ahorra.</em> Disfruta.</h1><p class="sub">Cupones en tus restaurantes favoritos de Quito.</p></div>
<form class="card" onsubmit="clientLogin(event)"><h3>Inicia sesión</h3>
<label>Correo electrónico</label><input class="field" id="le" type="email" required autocomplete="username">
<label>Contraseña</label><input class="field" id="lp" type="password" required autocomplete="current-password">
<div class="err" id="lerr">Usuario o contraseña incorrectos.</div>
<button class="btn" style="margin-top:16px">Iniciar sesión</button>
<p class="sub" style="text-align:center;margin-top:14px">¿Aún no tienes cuenta? <button type="button" class="link" onclick="openRegister()">Regístrate</button></p></form>
<div class="or">comercio</div>
<button class="btn sec" onclick="go('mlogin')">🏪 Soy un comercio</button></div>`}
function mloginH(){return`<div class="wrap"><button class="link" onclick="go('auth')">← Volver</button>
<div class="hero"><div class="logo" style="font-size:30px">Cuponera<b>ff.</b></div><h2 style="margin-top:8px">Acceso comercios</h2></div>
<form class="card" onsubmit="merchantLogin(event)"><label>Usuario</label><input class="field" id="mu" required autocomplete="username" placeholder="Usuario del comercio">
<label>Contraseña</label><input class="field" id="mp" type="password" required autocomplete="current-password">
<div class="err" id="merr">Usuario o contraseña incorrectos.</div>
<button class="btn" style="margin-top:16px">Ingresar</button></form>
<p class="sub" style="text-align:center">¿Quieres ser comercio socio? <button class="link" onclick="openMReq()">Solicítalo aquí</button></p></div>`}
async function clientLogin(e){e.preventDefault();
 const u=$('#le').value.trim().toLowerCase(),p=$('#lp').value;let acc=null;
 if(sb){try{const{data}=await sb.from('users').select('*').eq('email',u).eq('password',p).limit(1);if(data&&data.length)acc=data[0]}catch(x){}}
 const demo=u===DEMO.client.user&&p===DEMO.client.pass;
 if(!acc&&!demo){$('#lerr').style.display='block';toast('Usuario o contraseña incorrectos');return}
 setMe({role:'client',user:acc?acc.email.toLowerCase():DEMO.client.user,name:acc?acc.first+' '+acc.last:'Cliente',plan:acc?acc.plan:'free',status:acc?acc.status:'activo',createdAt:acc?acc.created_at:new Date().toISOString()});
 loadOffers();toast('Sesión iniciada')}
async function merchantLogin(e){e.preventDefault();
 const u=$('#mu').value.trim(),p=$('#mp').value;let m=null;
 if(sb){try{const{data}=await sb.from('merchants').select('*').eq('username',u).eq('password',p).limit(1);if(data&&data.length)m=data[0]}catch(x){}}
 const demo=u===DEMO.merchant.user&&p===DEMO.merchant.pass;
 if(!m&&!demo){$('#merr').style.display='block';toast('Usuario o contraseña incorrectos');return}
 setMe({role:'merchant',merchantId:m?m.id:DEMO.merchant.id,name:m?m.name:DEMO.merchant.name,user:u});loadOffers()}

// ====== Hojas (modales) ======
function sheet(h){const s=$('#sheet');s.innerHTML='<div class="sh"><button class="x" onclick="closeSheet()" aria-label="Cerrar">×</button>'+h+'</div>';s.classList.add('show')}
function closeSheet(){$('#sheet').classList.remove('show')}
function openRegister(){sheet(`<h2>Crear cuenta</h2><p class="sub">Ingresa tus datos para empezar a solicitar cupones.</p>
<form onsubmit="regStep1(event)"><div class="g2"><div><label>Nombre</label><input class="field" id="rf" required maxlength="60"></div><div><label>Apellido</label><input class="field" id="rl" required maxlength="60"></div></div>
<label>Fecha de nacimiento</label><input class="field" id="rb" type="date" required>
<label>Correo electrónico</label><input class="field" id="rm" type="email" required maxlength="120">
<label>Celular (10 dígitos)</label><input class="field" id="rph" type="tel" inputmode="numeric" maxlength="10" required placeholder="0991234567" oninput="this.value=this.value.replace(/\\D/g,'')">
<label>Contraseña</label><input class="field" id="rp1" type="password" required minlength="8" placeholder="Mínimo 8 caracteres">
<label>Confirmar contraseña</label><input class="field" id="rp2" type="password" required minlength="8">
<label style="display:flex;gap:8px;font-weight:600"><input id="rc" type="checkbox" required style="width:auto"><span>Acepto la <button type="button" class="link" onclick="openPrivacy()">Política de Protección de Datos</button>.</span></label>
<button class="btn" style="margin-top:14px">Continuar →</button></form>`)}
function openPrivacy(){sheet(`<h2>Protección de datos</h2><p class="sub" style="margin:8px 0"><b>1. Responsable.</b> Cuponeraff tratará los datos personales proporcionados.</p><p class="sub" style="margin:8px 0"><b>2. Datos tratados.</b> Nombres, apellidos, fecha de nacimiento, correo electrónico y celular.</p><p class="sub" style="margin:8px 0"><b>3. Finalidades.</b> Crear y administrar cuentas; emitir y gestionar cupones.</p><p class="sub" style="margin:8px 0"><b>4. Derechos.</b> Puedes solicitar acceso, rectificación y eliminación de tus datos.</p>`)}
function regStep1(e){e.preventDefault();
 const email=$('#rm').value.trim().toLowerCase(),phone=$('#rph').value.trim();
 if(!okMail(email))return toast('Ingresa un correo válido.');
 if(phone.length!==10)return toast('El celular debe tener 10 dígitos.');
 if($('#rp1').value!==$('#rp2').value)return toast('Las contraseñas no coinciden');
 pu={email,first:$('#rf').value.trim(),last:$('#rl').value.trim(),birth:$('#rb').value,phone,password:$('#rp1').value,plan:'free',status:'activo',created_at:new Date().toISOString()};
 plan='free';planSheet()}
function planSheet(){const P=[['free','Plan Free','$0','10 cupones disponibles'],['monthly','Plan Mensual','$2.99','Cupones ilimitados'],['annual','Plan Anual','$19.99','Duración de 1 año']];
 sheet(`<h2>Elige tu plan</h2><p class="sub">Último paso para activar tu cuenta.</p><div class="plans">${P.map(p=>`<div class="plan ${plan===p[0]?'on':''}" onclick="plan='${p[0]}';planSheet()"><div><b style="color:var(--ink);font-size:15px">${p[1]}</b><div class="sub">${p[3]}</div></div><b>${p[2]}</b></div>`).join('')}</div>
${plan!=='free'?`<div class="card" style="background:var(--cr)"><b>Pago por transferencia</b><p class="sub" style="margin:4px 0 8px">Banco Pichincha · Cta. Corriente No. 2100849201 · Cuponeraff S.A.</p><label style="margin-top:0">Últimos dígitos del comprobante</label><input class="field" id="cd" inputmode="numeric" maxlength="12" required></div>`:''}
<button class="btn" onclick="regFinish()">${plan==='free'?'Crear mi cuenta':'Validar el pago'}</button>`)}
async function regFinish(){
 if(!pu)return;pu.plan=plan;pu.status=plan!=='free'?'pendiente_pago':'activo';
 if(plan!=='free'){const d=($('#cd')?.value||'').trim();if(!d)return toast('Ingresa los dígitos del comprobante');pu.comprobante_digits=d}
 if(sb){try{const{error}=await sb.from('users').insert([pu]);if(error){toast('Error al registrar: '+error.message);return}}catch(e){toast('No se pudo conectar con la base de datos.');return}}
 const u=pu;pu=null;closeSheet();
 setMe({role:'client',user:u.email,name:u.first+' '+u.last,plan:u.plan,status:u.status,createdAt:u.created_at});loadOffers();toast('¡Cuenta creada! Bienvenido/a')}
function openMReq(){sheet(`<h2>Quiero ser comercio socio</h2><p class="sub">Revisaremos tu información y te contactaremos.</p>
<form onsubmit="sendMReq(event)"><label>Nombre del comercio</label><input class="field" id="bn" required maxlength="120">
<label>Correo electrónico</label><input class="field" id="be" type="email" required maxlength="120">
<label>Celular (10 dígitos)</label><input class="field" id="bp" type="tel" inputmode="numeric" maxlength="10" required oninput="this.value=this.value.replace(/\\D/g,'')">
<label>Dirección</label><input class="field" id="ba" required maxlength="220" placeholder="Calle, sector y ciudad">
<label>Instagram (opcional)</label><input class="field" id="bi"><label>TikTok (opcional)</label><input class="field" id="bt"><label>Facebook (opcional)</label><input class="field" id="bf">
<label style="display:flex;gap:8px;font-weight:600"><input id="bc" type="checkbox" required style="width:auto"><span>Acepto la <button type="button" class="link" onclick="openPrivacy()">Política de Privacidad</button>.</span></label>
<button class="btn" style="margin-top:14px">Enviar solicitud</button></form>`)}
async function sendMReq(e){e.preventDefault();
 const email=$('#be').value.trim(),phone=$('#bp').value.trim();
 if(!okMail(email))return toast('Ingresa un correo válido.');if(phone.length!==10)return toast('El celular debe tener 10 dígitos.');
 const r={id:uid(),name:$('#bn').value.trim(),email,phone,address:$('#ba').value.trim(),instagram:$('#bi').value.trim(),tiktok:$('#bt').value.trim(),facebook:$('#bf').value.trim(),status:'PENDIENTE',created_at:new Date().toISOString()};
 if(sb){try{await sb.from('merchant_requests').insert([r])}catch(x){}}
 sheet('<div class="empty"><div style="font-size:42px">🎉</div><h2>¡Gracias por tu interés!</h2><p class="sub" style="margin:8px 0 16px">Revisaremos tu solicitud y nos pondremos en contacto contigo.</p><button class="btn" onclick="closeSheet()">Listo</button></div>')}

// ====== Cliente: Inicio ======
function listH(){
 const l=offers.filter(isActive).filter(o=>(cat==='all'||o.category===cat)&&(!q||(o.shop+o.description+o.offer+o.category).toLowerCase().includes(q)));
 if(!l.length)return`<div class="empty">${loaded?'No hay promociones disponibles.':'Cargando promociones...'}</div>`;
 return l.map(o=>`<article class="card offer"><div class="vis"><span class="badge">${esc(o.discount)}</span><img loading="lazy" src="${esc(o.image)}" alt="${esc(o.shop)}"></div><div class="ob">
 <div class="row"><h3>${esc(o.shop)}</h3><span class="sub">${o.rating!==''?'★ '+esc(o.rating):''}</span></div>
 <p class="sub" style="margin:4px 0">${esc(o.description)}</p><p class="sub">📍 ${esc(o.branch)}, Quito</p>
 <div class="row" style="margin-top:12px"><small class="sub">Hasta ${esc(o.expires)}</small><button class="btn sm" onclick="claim('${esc(o.id)}')">Obtener cupón</button></div></div></article>`).join('')}
function homeH(){const cats=[...new Set(offers.filter(isActive).map(o=>o.category).filter(Boolean))];
 return`<input class="field" id="qs" placeholder="🔍 Buscar restaurante o promoción" value="${esc(q)}" oninput="q=this.value.toLowerCase();$('#ol').innerHTML=listH()" style="margin-bottom:10px">
 <div class="chips">${['all',...cats].map(c=>`<button class="chip ${cat===c?'on':''}" onclick="cat='${esc(c)}';render()">${c==='all'?'Todos':esc(c)}</button>`).join('')}</div><div id="ol">${listH()}</div>`}
async function claim(id){
 const o=offers.find(x=>x.id===id);if(!o)return;
 const exp=new Date();exp.setMonth(exp.getMonth()+1);
 const c={id:uid(),token:uid(),short_code:shortCode(),promotion_id:id,merchant_id:o.merchantId,merchant:o.shop,branch:o.branch,offer:o.offer,discount:o.discount,client:me.user,created_at:new Date().toISOString(),expires_at:exp.toISOString(),status:'ACTIVE'};
 if(sb){try{await sb.from('coupons').insert([c])}catch(e){}}
 coupons.push(c);cseg='act';go('coupons');toast('¡Cupón guardado!')}

// ====== Cliente: Mapa ======
function mapH(){return`<div id="map"></div>`}
async function initMap(){
 map=L.map('map').setView([-0.165,-78.484],13);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
 setTimeout(()=>map.invalidateSize(),100);
 if(!sb)return;
 try{const{data}=await sb.from('merchants').select('*');(data||[]).forEach(m=>{if(m.lat&&m.lng)L.marker([m.lat,m.lng]).addTo(map).bindPopup(`<b>${esc(m.name)}</b><br>${esc(m.category||'Aliado')}<br><small>${esc(m.address||m.branch||'Quito')}</small><br><a href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}" target="_blank" rel="noopener">Cómo llegar</a>`)})}catch(e){}}

// ====== Cliente: Mis cupones ======
function cardH(c){const s=eff(c),on=s==='ACTIVE',t=termsOf(c);
 return`<div class="card"><div class="row"><span class="pill ${on?'p-ok':s==='REDEEMED'?'p-used':'p-exp'}">${on?'DISPONIBLE':s==='REDEEMED'?'CANJEADO':'VENCIDO'}</span><small class="sub">${esc(c.branch)}</small></div>
 <h3 style="margin-top:8px">${esc(c.merchant)}</h3><p class="sub">${esc(c.offer)}</p>${on?termsH(t.t,t.v):''}
 <div class="row" style="margin-top:10px"><small class="sub">Caduca: ${fday(c.expires_at)}</small>${on?`<button class="btn sm" onclick="showCoupon('${c.id}')">Ver cupón</button>`:''}</div></div>`}
function couponListH(){const by=(a,b)=>new Date(b.created_at)-new Date(a.created_at);
 const l=coupons.filter(c=>cseg==='act'?eff(c)==='ACTIVE':eff(c)!=='ACTIVE').sort(by);
 return l.length?l.map(cardH).join(''):`<div class="empty">${cseg==='act'?'No tienes cupones disponibles.<br>Explora las promociones en Inicio.':'Aún no tienes cupones usados.'}</div>`}
function couponsH(){const n=coupons.filter(c=>eff(c)==='ACTIVE').length,h=coupons.length-n;
 return`<div class="seg"><button class="${cseg==='act'?'on':''}" onclick="cseg='act';render()">Disponibles${n?' ('+n+')':''}</button><button class="${cseg==='hist'?'on':''}" onclick="cseg='hist';render()">Usados${h?' ('+h+')':''}</button></div><div id="cl">${couponListH()}</div>`}
function showCoupon(id){const c=coupons.find(x=>x.id===id);if(!c)return;
 sheet(`<h2>${esc(c.merchant)}</h2><p class="sub">${esc(c.offer)}</p><div class="qr" id="qrb"></div><div class="code">${esc(c.short_code)}</div><p class="sub" style="text-align:center;margin:6px 0">Muestra el QR o dicta el código al pagar · un solo uso<br>Válido hasta el ${fday(c.expires_at)}</p>`);
 new QRCode($('#qrb'),{text:'CUPONERAFF|'+c.token,width:180,height:180,colorDark:'#252525',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}

// ====== Perfil (cliente y comercio) ======
function profileH(){const cl=me.role==='client';
 return`<div class="card" style="text-align:center"><div class="avatar">${esc(me.name[0]||'?').toUpperCase()}</div><h2>${esc(me.name)}</h2>${cl?`<p class="sub">${esc(me.user)}</p>`:'<p class="sub">Cuenta de comercio</p>'}</div>
 ${cl?`<div class="card"><div class="kv"><span>Correo</span><b>${esc(me.user)}</b></div><div class="kv"><span>Plan actual</span><b>${PLAN[me.plan]||PLAN.free}</b></div><div class="kv"><span>Miembro desde</span><b>${me.createdAt?fday(me.createdAt):'Reciente'}</b></div>${me.status==='pendiente_pago'?'<div class="kv"><span>Estado</span><b style="color:var(--o)">Pago pendiente de aprobación</b></div>':''}</div>`:''}
 ${ip?'<button class="btn sec" style="margin-bottom:10px" onclick="ip.prompt();ip=null;render()">📲 Instalar app</button>':''}
 <button class="btn red" onclick="logout()">Cerrar sesión</button>`}

// ====== Comercio ======
let mine=[],ev=[];
const myOffers=()=>offers.filter(o=>o.merchantId===me.merchantId||o.shop.toLowerCase()===me.name.toLowerCase());
async function loadMerchant(){
 if(sb){try{const a=await sb.from('coupons').select('*').eq('merchant_id',me.merchantId);if(a.data)mine=a.data;const b=await sb.from('events').select('*').eq('merchant_id',me.merchantId).order('at',{ascending:false});if(b.data)ev=b.data}catch(e){}}
 const al=$('#act');if(al)al.innerHTML=ev.length?ev.slice(0,12).map(x=>`<div class="log"><div><b>${RES[x.result]||esc(x.result)}</b><br><span class="sub">${esc(x.detail)}</span></div><span class="sub" style="text-align:right">${fdate(x.at)}</span></div>`).join(''):'<p class="sub">Todavía no hay lecturas.</p>';
 const ex=$('#ex');if(ex)ex.innerHTML=execBody()}
function validateH(){return`<div class="card"><h3>Validar cupón</h3><p class="sub">Escanea el QR o escribe el código de 5 caracteres.</p>
 <div id="reader" style="width:100%;margin-top:12px"></div>
 <div class="g2" style="margin:12px 0"><button class="btn sm" onclick="startScan()">📷 Activar cámara</button><button class="btn sm sec" onclick="stopScan()">Detener</button></div>
 <div class="row"><input class="field" id="mt" placeholder="Ej. L3413" maxlength="5" autocapitalize="characters"><button class="btn sm" onclick="validate($('#mt').value);$('#mt').value=''">Validar</button></div>
 <div id="sr"></div></div><div class="card"><h3>Actividad reciente</h3><div id="act" style="margin-top:8px"></div></div>`}
function sres(ok,t,h){$('#sr').innerHTML=`<div class="res ${ok?'ok':'no'}"><b>${ok?'✓':'✕'} ${t}</b><p style="margin-top:4px">${h}</p></div>`}
async function logEv(token,result,detail,c){const e={id:uid(),token,merchant_id:me.merchantId,merchant:me.name,actor:me.user||'comercio',result,detail,coupon_id:c?.id||null,at:new Date().toISOString()};if(sb){try{await sb.from('events').insert([e])}catch(x){}}ev.unshift(e)}
async function validate(v){
 const en=(v||'').trim().toUpperCase();if(!en)return toast('Introduce o escanea un código');
 let c=null;
 if(sb){try{const{data}=await sb.from('coupons').select('*').or(`short_code.eq.${en},token.eq.${en}`).limit(1);if(data&&data.length)c=data[0]}catch(e){}}
 if(!c)c=coupons.find(x=>x.short_code===en||x.token===en);
 const code=c?.short_code||en;let r;
 if(!c)r=['NOT_FOUND','Código no reconocido','No encontramos un cupón con ese código.'];
 else if(c.merchant_id!==me.merchantId)r=['WRONG_MERCHANT','Cupón de otro comercio','Pertenece a '+esc(c.merchant)+'.'];
 else if(c.status==='REDEEMED')r=['ALREADY_REDEEMED','Cupón ya utilizado','Este cupón ya fue canjeado.'];
 else if(c.status!=='ACTIVE')r=['INACTIVE','Cupón no disponible','Estado actual: '+esc(c.status)+'.'];
 else if(c.expires_at&&Date.now()>new Date(c.expires_at).getTime())r=['EXPIRED','Cupón vencido','La vigencia de este cupón terminó.'];
 if(r){await logEv(code,r[0],r[1],c);sres(false,r[1],r[2]);loadMerchant();return}
 await logEv(code,'READ_VALID','Lectura válida; pendiente de confirmación',c);
 sres(true,'Cupón válido',`<b>${esc(c.offer)}</b><br>Cliente: ${esc(c.client)}<br>Código: <b>${esc(c.short_code)}</b><br><button class="btn gr" style="margin-top:10px" onclick="redeem('${c.id}')">Confirmar canje</button><button class="btn sec sm" style="margin-top:8px" onclick="$('#sr').innerHTML=''">Cancelar</button>`);loadMerchant()}
async function redeem(id){
 let c=mine.find(x=>x.id===id)||coupons.find(x=>x.id===id);
 if(sb){try{const{data}=await sb.from('coupons').select('*').eq('id',id).limit(1);if(data&&data.length)c=data[0]}catch(e){}}
 if(!c||c.status!=='ACTIVE'){toast('El cupón ya no está disponible');$('#sr').innerHTML='';return}
 if(c.merchant_id!==me.merchantId)return toast('Comercio no autorizado');
 const at=new Date().toISOString();c.status='REDEEMED';c.redeemed_at=at;
 if(sb){try{await sb.from('coupons').update({status:'REDEEMED',redeemed_at:at,redeemed_by:me.user||'empleado'}).eq('id',id)}catch(e){}}
 await logEv(c.short_code||c.token,'REDEEMED','Canje confirmado',c);sres(true,'Canje confirmado','El cupón quedó inhabilitado.');toast('Canje registrado');loadMerchant()}
async function startScan(){
 if(!window.Html5Qrcode)return toast('No se pudo cargar el lector QR.');
 try{if(!qr)qr=new Html5Qrcode('reader');
  await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:200,height:200}},d=>{stopScan();validate(d.includes('|')?d.split('|').pop():d)},()=>{});toast('Cámara activada')}
 catch(e){toast('No se pudo activar la cámara.')}}
async function stopScan(){if(qr){try{if(qr.isScanning)await qr.stop()}catch(e){}qr=null}}
function execBody(){
 const red=mine.filter(c=>c.status==='REDEEMED'),camps=myOffers(),act=mine.filter(c=>eff(c)==='ACTIVE').length;
 const rows=camps.map(o=>({n:o.offer,v:red.filter(c=>c.promotion_id===o.id||c.offer===o.offer).length})),mx=Math.max(1,...rows.map(r=>r.v));
 return`<div class="metrics"><div><span>Canjeados</span><b>${red.length}</b></div><div><span>Campañas activas</span><b>${camps.filter(isActive).length}</b></div><div><span>Cupones activos</span><b>${act}</b></div><div><span>Lecturas</span><b>${ev.length}</b></div></div>
 <div class="card"><h3 style="margin-bottom:10px">Canjes por campaña</h3>${rows.length?rows.map(r=>`<div class="row"><small>${esc(r.n)}</small><b>${r.v}</b></div><div class="bar"><i style="width:${r.v/mx*100}%"></i></div>`).join(''):'<p class="sub">Aún no hay campañas.</p>'}</div>`}
function execH(){return`<div id="ex">${execBody()}</div>`}
function promosH(){const l=myOffers();if(!l.length)return'<div class="empty">No tienes campañas creadas en este momento.</div>';
 return l.map(o=>{const a=isActive(o);return`<article class="card offer"><div class="vis"><span class="badge">${esc(o.discount)}</span><img loading="lazy" src="${esc(o.image)}" alt=""></div><div class="ob"><h3>${esc(o.shop)}</h3><p class="sub">${esc(o.offer)}</p><p class="sub">📍 ${esc(o.branch)}, Quito</p>${termsH(o.terms.length?o.terms:TERMS,o.validAt||('Sucursal '+o.branch))}<div class="row"><small class="sub">Hasta ${esc(o.expires)}</small><span class="pill ${a?'p-ok':'p-exp'}">${a?'ACTIVA':'INACTIVA'}</span></div></div></article>`}).join('')}

// ====== Inicio de la PWA ======
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;if(me&&view==='profile')render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();loadOffers();if(me?.role==='client')loadCoupons();
</script></body></html>
